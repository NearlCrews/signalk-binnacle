<?xml version="1.0" encoding="UTF-8"?>
<!--
  Maskable variant of the Signal K webapp icon for Binnacle Chartplotter.

  Same artwork as binnacle-icon.svg, with the two changes an Android
  adaptive launcher needs. The background is full bleed instead of a
  rounded square, because the launcher supplies the mask shape. The wave
  motif and the compass badge are scaled to 0.70 about the canvas center,
  which puts the badge's farthest point 192px from center, inside the
  204.8px safe-zone radius that a maskable icon must respect.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Binnacle Chartplotter icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E4D6B"/>
      <stop offset="1" stop-color="#1A8DAB"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g transform="translate(256 256) scale(0.7) translate(-256 -256)">
    <g fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.94">
      <path d="M 80,176 q 44,-36 88,0 t 88,0 t 88,0 t 88,0"/>
      <path d="M 80,256 q 44,-36 88,0 t 88,0 t 88,0 t 88,0"/>
      <path d="M 80,336 q 44,-36 88,0 t 88,0 t 88,0 t 88,0"/>
    </g>

    <circle cx="388" cy="388" r="84" fill="#FFFFFF" stroke="#1B3A4B" stroke-width="8"/>

    <path fill="#1B3A4B" d="M 388 332 L 402 374 L 444 388 L 402 402 L 388 444 L 374 402 L 332 388 L 374 374 Z"/>
    <circle cx="388" cy="388" r="8" fill="#43A047"/>
  </g>
</svg>
