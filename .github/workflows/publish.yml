name: Publish to npm

# Fires when a GitHub release is published (the v<version> tag). Builds the production webapp into
# public/ and publishes the tarball to npm with a provenance attestation. Binnacle has no prepare
# or prepack lifecycle script (npm 10 runs prepare even under npm pack --ignore-scripts), so the
# build is an explicit step before publish rather than a lifecycle hook.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The tag check below reads history; nothing pushes, and npm auth comes from NPM_TOKEN,
          # so the git credential does not need to persist into .git/config.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install supported npm
        working-directory: ${{ runner.temp }}
        # zizmor: ignore[adhoc-packages] The pinned npm from packageManager, installed before any
        # npm command reads this repository. It is the version the lockfile was resolved with,
        # and Node 22 bundles one devEngines rejects, so there is no lockfile to install it from.
        run: npm install --global npm@11.19.0
      # Fail fast when the release tag and the package.json version disagree, so a release can never
      # publish a version that does not match its tag. The tag arrives through an env var (not inline
      # interpolation) so it cannot be expanded as shell.
      - name: Verify the release tag matches the package.json version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PKG_VERSION}"
          if [ "$TAG_NAME" != "$EXPECTED_TAG" ]; then
            echo "Release tag ($TAG_NAME) does not match expected tag ($EXPECTED_TAG)" >&2
            exit 1
          fi
      - name: Verify the release commit is on main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run verify:release
      - name: Pack the verified application
        run: |
          mkdir artifacts
          npm pack --ignore-scripts --pack-destination artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # id-token: write lets npm attach a provenance attestation to the published package.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: artifacts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Install supported npm
        working-directory: ${{ runner.temp }}
        # zizmor: ignore[adhoc-packages] The pinned npm from packageManager, installed before any
        # npm command reads this repository. It is the version the lockfile was resolved with,
        # and Node 22 bundles one devEngines rejects, so there is no lockfile to install it from.
        run: npm install --global npm@11.19.0
      # --access public is required for the first publish of a new package when generating
      # provenance; for later versions it is the default for an unscoped public package.
      # The explicit relative prefix keeps npm from interpreting the tarball path as GitHub shorthand.
      - run: npm publish ./artifacts/*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
