name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static security analysis of these workflows themselves: token persistence, injection through
  # untrusted expressions, and unpinned action references. Kept a separate job so a workflow problem
  # is legible on its own rather than buried in the verify log. The floor is medium; the one low
  # finding left is an ad-hoc install this repository documents in place as deliberate.
  workflow-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          min-severity: medium
          # This job proves the workflows are clean; it does not file code-scanning alerts, which
          # would need security-events: write on a job that reads workflow files.
          advanced-security: false

  # The one full gate per push: the Node-independent checks, unit and Playwright browser tests,
  # package integrity, and both dependency audits. The full audit gates every push because the
  # shipped browser code is bundled from devDependencies.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, tags, or uses the ambient token, so the checkout does not leave it in
          # .git/config where an uploaded artifact could carry it off.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # These caches restore files without ever invoking npm, so they honor the invariant that no
      # npm command runs before the pinned upgrade below (setup-node's own cache would run the
      # bundled npm to locate the cache directory, which is why check-workflows.mjs forbids it).
      - name: Cache the npm download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Cache the Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Install the supported npm outside the checkout. The bundled npm may be older than
      # devEngines permits, so it cannot safely inspect this package before the upgrade.
      - name: Install supported npm
        working-directory: ${{ runner.temp }}
        # zizmor: ignore[adhoc-packages] The pinned npm from packageManager, installed before any
        # npm command reads this repository. It is the version the lockfile was resolved with,
        # and Node 22 bundles one devEngines rejects, so there is no lockfile to install it from.
        run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run verify:ci
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failures
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
