name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static security analysis of these workflows themselves: token persistence, injection through
  # untrusted expressions, and unpinned action references. Kept a separate job so a workflow problem
  # is legible on its own rather than buried in the verify log. The floor is medium; the one low
  # finding left is an ad-hoc install this repository documents in place as deliberate.
  workflow-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          min-severity: medium
          # This job proves the workflows are clean; it does not file code-scanning alerts, which
          # would need security-events: write on a job that reads workflow files.
          advanced-security: false

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No step pushes, tags, or uses the ambient token, so the checkout does not leave it in
          # .git/config where an uploaded artifact could carry it off.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # Install the supported npm outside the checkout. The bundled npm may be older than
      # devEngines permits, so it cannot safely inspect this package before the upgrade.
      - name: Install supported npm
        working-directory: ${{ runner.temp }}
        # zizmor: ignore[adhoc-packages] The pinned npm from packageManager, installed before any
        # npm command reads this repository. It is the version the lockfile was resolved with,
        # and Node 22 bundles one devEngines rejects, so there is no lockfile to install it from.
        run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run verify:ci
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-failures
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
