name: SignalK Webapp CI

# Binnacle is a Signal K webapp, not a server plugin, so it does NOT use the official reusable
# SignalK/signalk-server plugin-ci.yml: that workflow's plugin-entry-point, schema(), and
# start/stop lifecycle steps run unconditionally and would fail for a webapp that exports no plugin.
# This mirrors the parts of plugin-ci that DO apply to a webapp: a clean cross-platform build, the
# tests, and a clean `npm pack` (the App Store install check), across Linux, macOS, and Windows on
# the lowest supported Node (22.18) and current Node (26). The full gate runs on Linux Node 24 in
# ci.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signalk-webapp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-pack:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.18.0, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No step pushes, tags, or uses the ambient token, so the checkout does not leave it in
          # .git/config where an uploaded artifact could carry it off.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # Node 22 bundles an npm version that devEngines intentionally rejects. Upgrade outside the
      # checkout before any npm command evaluates the repository package.
      - name: Install supported npm
        working-directory: ${{ runner.temp }}
        # zizmor: ignore[adhoc-packages] The pinned npm from packageManager, installed before any
        # npm command reads this repository. It is the version the lockfile was resolved with,
        # and Node 22 bundles one devEngines rejects, so there is no lockfile to install it from.
        run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm run package:check
      # Simulate the App Store install: pack with lifecycle scripts disabled and confirm the tarball
      # path is clean. Binnacle defines no prepare or prepack script, so no lifecycle banner can
      # corrupt the captured path with the repository's pinned npm version.
      # zizmor: ignore[adhoc-packages] Installing the tarball this job just packed is the point: it
      # simulates what the Signal K App Store does to a published webapp. There is no lockfile to
      # install this from, because the artifact under test is the pack output itself.
      - name: Simulate App Store install (npm pack --ignore-scripts)
        shell: bash
        run: |
          # npm pack prints only the tarball filename; the file is created in --pack-destination,
          # so check it there rather than in the working directory.
          PLUGIN_TGZ=$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP")
          echo "Packed: $RUNNER_TEMP/$PLUGIN_TGZ"
          test -f "$RUNNER_TEMP/$PLUGIN_TGZ"
          npm install "$RUNNER_TEMP/$PLUGIN_TGZ" --ignore-scripts --prefix "$RUNNER_TEMP/install"
          test -f "$RUNNER_TEMP/install/node_modules/signalk-binnacle/public/index.html"
