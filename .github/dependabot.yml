# A cooldown holds each new release for a week before Dependabot proposes it. A compromised package
# is usually caught and yanked within hours of publication, so waiting is what keeps this repository
# from being the first consumer of a malicious version. Security updates are exempt by design.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      # Node types follow the lowest supported runtime, currently Node 22.18.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # Size Limit 14 requires Node 22.19, above the supported Node 22.18 floor.
      - dependency-name: size-limit
        update-types:
          - version-update:semver-major
      - dependency-name: "@size-limit/file"
        update-types:
          - version-update:semver-major
    groups:
      vitest:
        applies-to: version-updates
        patterns:
          - vitest
          - "@vitest/*"
      size-limit:
        applies-to: version-updates
        patterns:
          - size-limit
          - "@size-limit/*"
      dev-dependencies:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - vitest
          - "@vitest/*"
          - size-limit
          - "@size-limit/*"
        update-types:
          - minor
          - patch
      production-dependencies:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        exclude-patterns:
          - vitest
          - "@vitest/*"
          - size-limit
          - "@size-limit/*"
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies
      - npm

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
